<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Holiday Split</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, three tabs, a round green add button bottom right. Soft pastels; avatars and icons carry meaning instead of text. */
:root{
  --bg:#f6f7fb;--card:#ffffff;--fg:#232838;--muted:#767d92;--line:#e6e8f0;--tile:#f0f2f8;
  --accent:#5c6cc9;--soft:#e3e7fb;--soft-ink:#2c3670;
  --go:#3fb27a;--wa:#cdeedb;--wa-ink:#1d5a3a;
  --pos:#2f9461;--neg:#cf5a62;--note:#fff1d9;--note-ink:#6e5317;
  --display:"Outfit",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151c;--card:#1c1f29;--fg:#e9ebf3;--muted:#949ab0;--line:#2a2e3b;--tile:#252937;
  --accent:#a3b0f5;--soft:#2c3358;--soft-ink:#dfe4ff;
  --go:#3fb27a;--wa:#1f3d2d;--wa-ink:#bdebd0;
  --pos:#7fd4a5;--neg:#f19aa0;--note:#3a311b;--note-ink:#f3dba4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151c;--card:#1c1f29;--fg:#e9ebf3;--muted:#949ab0;--line:#2a2e3b;--tile:#252937;
  --accent:#a3b0f5;--soft:#2c3358;--soft-ink:#dfe4ff;
  --go:#3fb27a;--wa:#1f3d2d;--wa-ink:#bdebd0;
  --pos:#7fd4a5;--neg:#f19aa0;--note:#3a311b;--note-ink:#f3dba4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{display:flex;align-items:center;gap:8px;padding-block:18px 12px}
#trip{flex:1;min-width:0;font:700 1.6rem/1.2 var(--display);background:none;border:0;padding:4px 0}
#trip:focus{outline:none;border-bottom:1px dashed var(--line)}
.iconbtn{border:0;background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--muted);flex:none}

.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--note);color:var(--note-ink);border-radius:14px;padding:8px 8px 8px 14px;font-size:.9rem;font-weight:500;margin-bottom:12px}
.banner span{flex:1;min-width:10em}
.banner.offline{flex-wrap:nowrap}.banner.offline>svg.i{flex:none;width:20px;height:20px}
#cloud[data-s="offline"]{opacity:1;color:var(--note-ink)}
.banner .bb{display:flex;gap:6px}
.banner button{background:var(--card);border:0;color:var(--fg);border-radius:9px;padding:7px 12px;font-weight:600}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;box-shadow:0 1px 0 var(--line)}
.tabs button{border:0;background:none;border-radius:10px;padding:9px 0;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--soft-ink)}

/* avatars: pastel fill, dark initial */
.av{--s:30px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#2a2f3d;font:700 calc(var(--s)*.46)/1 var(--display);flex:none}
.av.sm{--s:22px}.av.lg{--s:40px}
.stack{display:inline-flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--card)}
.stack .av+.av{margin-left:-7px}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:0 5px;color:var(--muted);font-size:.8rem;margin-top:3px;min-width:0}.who>span{white-space:nowrap}
.who svg.i{width:14px;height:14px}

.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}
.bar b{font:700 1.7rem var(--display)}
.ghost{border:0;background:none;color:var(--accent);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px;padding:6px 4px}

.day{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dayh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:13px 14px;font-weight:600;text-align:left}
.dayh .d{flex:1}
.dayh .s{color:var(--muted);font-weight:500}
.dayh svg.i{color:var(--muted);transition:transform .15s}
.day.open .dayh svg.i{transform:rotate(90deg)}
.items{list-style:none;margin:0;padding:0 6px 6px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:9px 8px}
button.row:hover{background:var(--tile)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#3a4052}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:48px 10px}

h2{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px}
.card{background:var(--card);border-radius:16px;padding:6px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.flow{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600;flex-wrap:wrap}
.flow svg.i{color:var(--muted)}
.square{padding:18px;text-align:center;color:var(--muted);font-weight:500}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;background:var(--card);border-radius:14px;padding:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.primary{background:var(--soft);color:var(--soft-ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.danger{color:var(--neg);background:var(--tile)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:8px 0 0}

.addp{display:flex;gap:8px;margin-top:14px}
.addp input{flex:1;min-width:0}
.field{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;width:100%}
.x{border:0;background:none;color:var(--muted);padding:8px}
.msg{color:var(--neg);font-size:.88rem;margin:6px 4px 0}
.msg:empty{display:none}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--go);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgb(30 110 70 / .32);z-index:3}
.fab svg.i{width:30px;height:30px;stroke-width:2.6}

.scrim{position:fixed;inset:0;background:rgb(10 12 20 / .4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
@supports (height:1dvh){.sheet{max-height:94dvh}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h3{margin:0;font:700 1.25rem var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh>.iconbtn:first-child{background:var(--card);margin-left:-4px}
.sh>.iconbtn:last-child:not(:first-child){background:var(--card)}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.daterow input{border:0;background:var(--card);border-radius:10px;padding:8px 10px;font:500 .95rem var(--body);color:var(--fg);text-transform:none;letter-spacing:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto -4px;flex:none}
.grab,.sh{touch-action:none}
.scrim,.sheet{overscroll-behavior:contain}
.sh input{border:0;background:var(--card);border-radius:10px;padding:7px 9px;font-size:.9rem}
.big{font:700 2rem var(--display)!important;text-align:center;padding:14px!important}
.descrow{display:flex;gap:8px;position:relative}
.descrow input{flex:1;min-width:0}
.catbtn{border:0;border-radius:12px;width:52px;display:flex;align-items:center;justify-content:center;gap:2px;flex:none;color:#3a4052}
.catbtn.none{background:var(--tile);color:var(--muted)}
.catbtn .caret{width:12px;height:12px;transform:rotate(90deg);opacity:.6}
.catmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border-radius:16px;box-shadow:0 12px 32px rgb(10 14 30 / .2);padding:8px;display:grid;grid-template-columns:repeat(4,46px);gap:6px;z-index:5}
.cat{border:2px solid transparent;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;color:#3a4052}
.cat[aria-pressed="true"]{border-color:var(--accent)}
.pick{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 2px;scrollbar-width:none}
.pa{border:0;background:none;padding:0;flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.38;filter:saturate(.5);transition:opacity .12s}
.pa .av{border-radius:50%}
.pa[aria-pressed="true"]{opacity:1;filter:none}
.pa[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.pn{font-size:.75rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.two{font-size:calc(var(--s)*.38);letter-spacing:-.02em}
.lbl em{font-style:normal;color:var(--fg);text-transform:none;letter-spacing:0;font-size:.9rem;margin-left:6px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:-6px}
.lbl button{background:none;border:0;color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;display:inline-flex;align-items:center;gap:7px;opacity:.5}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--accent)}
.each{color:var(--muted);font-size:.85rem;text-align:center;min-height:1.2em}
.sheet .foot{display:flex;gap:10px}
.sheet .foot .primary{flex:1}

/* settings */
.set{background:var(--card);border-radius:16px;padding:4px 14px}
.set>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set>div:last-child{border-bottom:0}
.set .col{flex-direction:column;align-items:stretch;gap:8px}
.set label{font-weight:600}
.set small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.set input.field,.set textarea.field{padding:10px}
.set textarea.field{resize:vertical;font:13px/1.4 ui-monospace,monospace}
.cur{width:4em;text-align:center}
.sw{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .15s}
.sw:checked{background:var(--go)}
.sw:checked::after{transform:translateX(20px)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;font-weight:500;z-index:20;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
/* sync + trips */
#cloud[data-s="ok"]{color:var(--go)}
@media (prefers-reduced-motion:no-preference){#cloud[data-s="sync"] svg{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.set .trip{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-weight:600;border-bottom:1px solid var(--line)}
.set .trip:last-child{border-bottom:0}
.set .trip svg.i{color:var(--go)}
.set .trip.newt{color:var(--accent);justify-content:flex-start}
.status{font-size:.8rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-top:16px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--soft-ink)}
.row.pickme{outline:2px dashed var(--accent);outline-offset:-2px}
.row.linking,.x[aria-pressed="true"]{color:var(--accent)}
.pickhint{color:var(--accent);font-weight:600;text-align:center;margin:12px 0 0}
svg.i.tiny{width:14px;height:14px;vertical-align:-2px}
.invite{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
/* me card */
.mecard{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:12px 16px;margin-top:14px;color:var(--fg)}
.mehead2{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:2px 0;text-align:left;font:500 1.1rem/1.3 var(--body);color:var(--fg)}
.mehead2 b{font-weight:700}
.mechev{color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.mehead2[aria-expanded="true"] .mechev{transform:rotate(-90deg)}
.melist{margin:10px 0 2px 2px;padding-left:12px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:6px}
.melist button{border:0;background:none;padding:0;text-align:left;font:400 .92rem/1.35 var(--body);color:var(--muted)}
.melist b{font-weight:600}
.melist .memore{color:var(--muted)}
.mehead{font:600 .95rem var(--body);color:var(--muted);margin-bottom:4px}
.mebig{font:700 1.35rem/1.25 var(--display)}
.melines{margin-top:6px;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:.9rem}
.melines b{color:var(--fg);font-weight:600}
/* rows: right column with amount + my position */
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;max-width:46%;text-align:right}
.mine{font-size:.75rem;font-weight:600;line-height:1.3}.mine .ma,.rt .amt{white-space:nowrap}
.mine.none{color:var(--muted);font-weight:500}
.orig{margin-left:4px}
.srow{flex-wrap:wrap;row-gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1 0 100%}
a.paidbtn{text-decoration:none;display:inline-block}
.paybtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-size:.8rem;font-weight:700}
.nudge{display:flex;align-items:center;gap:10px;background:var(--soft);color:var(--soft-ink);border-radius:14px;padding:10px 10px 10px 14px;margin-top:14px;font-size:.9rem;font-weight:500}
.nudge span{flex:1}.nudge .btn{padding:8px 14px}
.payamt{display:flex;align-items:center;justify-content:center;gap:8px;font:700 2rem var(--display)}
.payopts{display:flex;flex-direction:column;gap:8px}
.payopt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;color:var(--fg);text-decoration:none}
.payopt span{display:flex;flex-direction:column;gap:2px}.payopt small{color:var(--muted);font-size:.8rem}
.payopt svg.i{color:var(--muted)}
.bankbox{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copyrow span{display:flex;flex-direction:column;font-weight:600;min-width:0;overflow-wrap:anywhere}.copyrow small{color:var(--muted);font-weight:500;font-size:.75rem}
.copy{border:0;background:var(--tile);color:var(--fg);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.askpay{color:var(--muted);text-align:center;margin:0}
.f2{display:flex;flex-direction:column;gap:6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.f2 .field{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);font-weight:400}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts2{display:flex;gap:6px;flex:none}.acts2 .btn{padding:9px 12px}
.warnbox{display:flex;flex-direction:column;gap:6px;background:var(--note);color:var(--note-ink);border-radius:14px;padding:12px 14px;font-size:.92rem}
.btn.danger.solid{background:var(--neg);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tripsub{margin:-8px 2px 10px;color:var(--muted);font-size:.85rem;font-weight:500}
.tripsub:empty{display:none}
.bar .tot{color:var(--muted);font-size:.9rem}.bar .tot b{color:var(--fg);font:700 1.05rem var(--body);margin-left:4px}
.bar{padding:14px 2px 8px}
.who .sep{opacity:.6}
.srow{flex-wrap:nowrap}
.srow .flow{flex:1;min-width:0;gap:6px;flex-wrap:nowrap;font-weight:600}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.srow .flow svg.i{width:16px;height:16px;flex:none}
.srow .acts{flex:none;display:flex;gap:6px}
.pill{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;height:30px;padding:0 10px;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.pill.ico{padding:0;width:30px;justify-content:center}
.pill.pay{border-color:var(--accent);background:var(--accent);color:#fff;padding:0 14px}
.h2row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.h2row h2{margin:0 4px}
.h2acts{display:flex;gap:6px}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.wa{background:var(--wa);color:var(--wa-ink)}
.sxbar{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--card);border-radius:14px;padding:10px 12px 10px 14px;margin:0 0 10px;text-align:left;color:var(--fg);font:500 .9rem var(--body)}
.sxbar span{flex:1;min-width:0}.sxbar small{color:var(--muted);font-size:.78rem;white-space:nowrap}.sxbar svg{flex:none}
.payrate{margin:-2px 0 10px;color:var(--muted);font-size:.82rem;text-align:center}
.ccpick{display:flex;flex-wrap:wrap;gap:8px}
.ccopt{min-width:54px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:600 1rem var(--body);color:var(--fg)}
.ccopt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--soft-ink)}
.ratebox{display:flex;align-items:center;gap:8px;margin-top:4px}.ratebox b{font-size:1.05rem;white-space:nowrap}.ratebox .field{flex:1;font-size:1.1rem}
.banner.news{background:var(--soft);color:var(--soft-ink)}
.about{text-align:center;color:var(--muted);font-size:.8rem;margin:18px 0 4px;line-height:1.6}.about a{color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);font:600 .95rem var(--body);padding:8px;margin-top:4px}
.help{background:var(--card);border-radius:14px;margin-bottom:8px}
.help summary{display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:600;cursor:pointer;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--soft-ink)}
.help summary .ic svg{width:18px;height:18px}.help summary span{flex:1}
.help summary .fchev{margin-top:0;flex:none}.help[open] summary .fchev{transform:rotate(-90deg)}
.help ul{margin:0;padding:0 16px 14px 62px;color:var(--fg);font-size:.92rem;line-height:1.5}.help li{margin-bottom:6px}

[aria-expanded="true"]>.fchev{transform:rotate(-90deg)}
.square.sm{padding:12px;font-size:.88rem}

.dupone .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#3a4052}

<body>

    <input id="trip" type="text" aria-label="Trip name">
    <button class="iconbtn" id="cloud" aria-label="Sync now" hidden><svg class="i"><use href="#i-cloud"/></svg></button>
    <button class="iconbtn" id="gear" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <p class="tripsub" id="tripsub"></p>
  <div class="banner" id="deleted" hidden><span id="delText"></span><button id="restoreBtn">Restore</button></div>
  <div class="banner" id="revoked" hidden><span>This trip's link was reset. Open the new link from the group to keep syncing. Your changes will carry over.</span></div>

<script>
/* Data model: every person/expense has an id and updatedAt (u); deletes are tombstones (del). Amounts in pence.
   Sync: each trip lives on the Worker at /api/trip/<id>. Phones GET to pull, PUT to push; the server merges, newest u wins. */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const newId=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,b=>(b%36).toString(36)).join('')};
const TRIP_ID=/^[a-z0-9]{12,40}$/;
const now=()=>Date.now();
/* dates are the phone's local calendar day (toISOString would give UTC, i.e. yesterday just after midnight in Italy) */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(id,cls='i')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;

const COLORS=['#ffcfb3','#bfe6c9','#bcd8f5','#dccbf3','#f8c3cd','#b2e3df','#f6e1a6','#ccd1f7'];
const CATS=['food','groceries','drinks','transport','stay','activity','other'];
const CAT_COL={food:'#ffdcc7',groceries:'#cdeed7',drinks:'#f9d3dc',transport:'#cfe2f8',stay:'#e3d6f6',activity:'#f8e8b8',other:'#dde1ea'};
const CAT_RX={
  groceries:/super|market|grocer|shop|tesco|lidl|aldi|mercadona|carrefour|spar|co-?op|conad|eurospin|coop|esselunga|bakery/i,
  drinks:/drink|bar\b|beer|wine|pub|cocktail|coffee|caf[eé]|gin/i,
  food:/dinner|lunch|breakfast|brunch|meal|restaurant|tapas|pizza|food|snack|ice ?cream|takeaway|burger|sushi/i,
  transport:/taxi|uber|bolt|bus|train|car\b|hire|fuel|petrol|diesel|parking|flight|ferry|transfer|airport|toll|metro/i,
  stay:/hotel|airbnb|villa|apartment|hostel|room|stay|accommodation/i,
  activity:/ticket|boat|tour|museum|entry|excursion|golf|surf|kayak|show|beach|spa|park/i
};
const CAT_NAME={food:'Food',groceries:'Groceries',drinks:'Drinks',transport:'Transport',stay:'Stay',activity:'Activities',other:'Other'};
const CAT_FILL={food:'#f4a578',groceries:'#79c995',drinks:'#ec8fa5',transport:'#7fafe8',stay:'#ac94e3',activity:'#e3bf50',other:'#a3aabb'};
const PAY_COL='#d6f1e2',CCS=['€','£','$','CHF','kr','zł','Kč','Ft','¥','₺'];
const matchCat=d=>CATS.find(c=>CAT_RX[c]&&CAT_RX[c].test(d));
const guessCat=d=>matchCat(d)||'other';

function sample(){
  const P=['Chris','Sam','Alex','Jo'].map((n,i)=>({id:uid(),name:n,c:i,u:now()}));
  P[0].pair=P[1].id;P[1].pair=P[0].id;P[2].pair=P[3].id;P[3].pair=P[2].id;
  const [c,s,a,j]=P.map(p=>p.id), d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)};
  const E=[
    ['Tapas dinner',8640,d(0),c,[c,s,a,j]],
    ['Beach bar',2450,d(0),s,[c,s,a,j]],
    ['Mercadona',4215,d(1),s,[c,s,a,j]],
    ['Boat trip',6000,d(1),a,[c,a]],
    ['Taxi from airport',3800,d(2),j,[c,s,a,j]],
    ['Villa deposit',30000,d(2),c,[c,s,a,j]],
  ].map(([desc,amt,date,paidBy,f])=>({id:uid(),desc,amt,date,paidBy,for:f,cat:guessCat(desc),u:now()}));
  return {v:1,id:'sample',name:'Spain 2026',cur:'€',nu:0,sample:true,people:P,expenses:E,u:now()};
}
const blank=()=>({v:1,id:newId(),key:randKey(),pk:randKey(),name:'My trip',cur:'£',nu:now(),people:[],expenses:[],u:now(),dirty:true});
const fix=t=>{t.people=t.people||[];t.expenses=t.expenses||[];
  const used=new Set();t.expenses.forEach(e=>{if(!e.del){used.add(e.paidBy);(e.for||[]).forEach(i=>used.add(i))}});
  t.people.forEach(p=>{if(p.del&&used.has(p.id))delete p.del});
  t.people.forEach((p,i)=>{if(p.c==null)p.c=i%COLORS.length});t.expenses.forEach(e=>{if(!e.cat)e.cat=guessCat(e.desc)});if(t.nu==null)t.nu=0;return t};

/* ---- Local storage: one key per trip, plus device prefs (current trip, trip list, sync on/off) ---- */
const TK=id=>'hs-trip-'+id, PKEY='holiday-split-prefs';
let prefs={sync:true,cur:null,trips:[]};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PKEY))||{})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PKEY,JSON.stringify(prefs))}catch(e){}};
const loadTrip=id=>{try{const t=JSON.parse(localStorage.getItem(TK(id)));return t&&t.v?fix(t):null}catch(e){return null}};
function persist(){
  try{localStorage.setItem(TK(S.id),JSON.stringify(S))}catch(e){}
  if(!S.sample){const l=prefs.trips.find(t=>t.id===S.id);if(l){l.name=S.name;l.del=S.del||null}else prefs.trips.unshift({id:S.id,name:S.name,del:S.del||null})}
  prefs.cur=S.id;savePrefs();
}
/* Deleted trips: kept for 30 days so they can be restored, then removed from the phone (and expire on the server) */
const KEEP_DELETED=30*864e5;
const goneAt=t=>t.del||t.local||0;
const daysLeft=t=>Math.max(0,Math.ceil((goneAt(t)+KEEP_DELETED-now())/864e5));
function purgeDeleted(){
  prefs.trips=prefs.trips.filter(t=>{if(goneAt(t)&&now()-goneAt(t)>KEEP_DELETED){try{localStorage.removeItem(TK(t.id))}catch(e){}return false}return true});
  savePrefs();
}
/* migrate the earlier single-trip save */
try{const old=JSON.parse(localStorage.getItem('holiday-split-v1'));
  if(old&&old.v){if(old.sample)old.id='sample';else if(!TRIP_ID.test(old.id)){old.id=newId();old.dirty=true}
    fix(old);localStorage.setItem(TK(old.id),JSON.stringify(old));if(!old.sample)prefs.trips.unshift({id:old.id,name:old.name});prefs.cur=old.id;savePrefs()}
  localStorage.removeItem('holiday-split-v1')}catch(e){}

purgeDeleted();
const firstLive=()=>prefs.trips.find(t=>!goneAt(t)&&loadTrip(t.id));
let S=(prefs.cur&&!(prefs.trips.find(t=>t.id===prefs.cur)||{}).local&&loadTrip(prefs.cur))||fix(sample());

/* every user edit goes through save(): marks the trip as needing a push */
let seq=0;
const save=()=>{S.u=now();S.dirty=true;seq++;persist();kick()};

/* ---- Sync ---- */
let syncAvail=false,scanAvail=false,syncing=false,again=false,kickT;
const api=id=>'/api/trip/'+id;
const syncOn=()=>syncAvail&&prefs.sync&&!S.sample&&!S.revoked;
/* ---- End-to-end encryption ----
   Each trip has a random 256-bit key that lives only in the invite link (#id.key) and on phones; the server stores
   AES-GCM ciphertext it cannot read. Photos use a second key (pk) kept inside the encrypted trip. */
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function randKey(){return b64u(crypto.getRandomValues(new Uint8Array(32)))}
const keyCache={};
const cryptoKey=k=>keyCache[k]||(keyCache[k]=crypto.subtle.importKey('raw',ub64u(k),'AES-GCM',false,['encrypt','decrypt']));
async function seal(k,bytes){
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await cryptoKey(k),bytes));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;
}

  syncing=true;setNet('sync');
  const trip=S,sent=seq,hdr={'content-type':'application/json'};
  const gone=async r=>{let why='';try{why=(await r.json()).error}catch(e){}
    if(why==='erased'){eraseLocal(trip.id);toast(`${trip.name} was permanently deleted`);setNet(syncOn()?'ok':'off');return}
    if(S===trip){S.revoked=true;persist();render()}setNet('off')};
  try{
    if(trip.key){
      /* encrypted: pull + merge on the phone, then push with the revision we merged from; 409 = someone else saved first */
      let r=await fetch(api(trip.id),{cache:'no-store'}),remote=null;
      if(r.status===410)return gone(r);
      if(r.ok){const env=await r.json();remote=await decTrip(env,trip.key);trip.rev=env.rev;if(S===trip)mergeIn(remote)}
      else if(r.status!==404)throw new Error(r.status);

        r=await fetch(api(trip.id),{method:'PUT',headers:hdr,body:JSON.stringify(await encTrip(trip))});

      let r=trip.dirty?await put():await fetch(api(trip.id),{cache:'no-store'});
      if(r.status===404)r=await put();
      if(r.status===410)return gone(r);
      if(!r.ok)throw new Error(r.status);

/* merge a remote copy into the open trip; newest u wins */
function mergeIn(t){

    if(!l){S[k].push(x);changed++;if(!x.del&&k==='expenses')added++}
    else if((x.u||0)>(l.u||0)){Object.assign(l,x);changed++}
  }));
  if((t.nu||0)>(S.nu||0)){S.name=t.name;S.cur=t.cur;S.nu=t.nu;changed++}
  if(!S.pk&&t.pk)S.pk=t.pk;
  if((t.du||0)>(S.du||0)){S.del=t.del||null;S.delBy=t.delBy||null;S.du=t.du;changed++}
  if((t.sxu||0)>(S.sxu||0)){S.sx=t.sx||null;S.sxu=t.sxu;changed++}
  fix(S);persist();

function tripSub(){
  const ds=spend().map(e=>e.date).sort(),n=people().length,ppl=n?`${n} ${n===1?'person':'people'}`:'';
  if(!ds.length)return ppl;
  const d=x=>new Date(x+'T12:00'),a=d(ds[0]),b=d(ds[ds.length-1]),mon=x=>x.toLocaleDateString('en-GB',{month:'short'});
  const range=ds[0]===ds[ds.length-1]?`${a.getDate()} ${mon(a)}`:mon(a)===mon(b)&&a.getFullYear()===b.getFullYear()?`${a.getDate()}–${b.getDate()} ${mon(b)}`:`${a.getDate()} ${mon(a)} – ${b.getDate()} ${mon(b)}`;
  return [range,ppl].filter(Boolean).join(' · ');
}

  h+='</div>';

    h+=`<div class="nudge"><span>Add your payment details so the group can pay you in one tap.</span><button class="btn primary" data-paydetails="${m0}">Add</button></div>`;
  /* recorded payments: tap the ✓ to mark as not paid (Undo puts it back) */
  const pays=expenses().filter(isPay);
  if(pays.length)h+='<h2>Paid</h2><div class="card">'+pays.map(e=>`<div class="row"><span class="flow">${av(e.paidBy)}<span>${esc(pname(e.paidBy))}</span>${ico('i-arrow')}${av(e.for[0])}<span>${esc(pname(e.for[0]))}</span></span><span class="rt"><span class="amt">${e.cc?fmtCc(e.oamt,e.cc):money(e.amt)}</span><button class="paidtoggle" data-unpay="${e.id}" aria-pressed="true" aria-label="Paid. Tap to mark as not paid">${ico('i-check','i tiny')}Paid</button></span></div>`).join('')+'</div>';

    const bp={};people().forEach(p=>bp[p.id]=0);sp.forEach(e=>{const sh=shares(e);for(const id in sh)if(id in bp)bp[id]+=sh[id]});
    const ppl=Object.entries(bp).sort((a,b)=>b[1]-a[1]);

    h+=`<button class="btn wide" id="export">${ico('i-dl')}Export spreadsheet</button>`;

  $('#bal').innerHTML=h;
}

  };
  sc.innerHTML=`<form class="sheet" id="eform" role="dialog" aria-label="${isNew?'Add':'Edit'} expense">

/* ---- Duplicates: the amount must match (to the cent, or the same foreign amount), and then
   - the same shop name within 2 days, or
   - the same day, when the names don't clash and the type matches (e.g. "Groceries" vs "Eurospin").
   Different shop names, different types or different amounts are never flagged.
   "Not a duplicate" is remembered on the expense (notdup) and syncs, so nobody is asked twice. */
const DUP_GENERIC=new Set(['dinner','lunch','breakfast','brunch','coffee','coffees','drinks','food','groceries','supermarket','expense','restaurant','cafe','taxi','ticket','tickets','shop','shopping','snacks','pizza','gelato','payment','with','from','the','and','for']);
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const shopWords=t=>normTxt(t).split(' ').filter(w=>w.length>=4&&!DUP_GENERIC.has(w)&&!/^\d+$/.test(w));
const dayGap=(a,b)=>Math.abs(new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5;
const sameAmount=(a,b)=>a.amt===b.amt||(!!a.cc&&a.cc===b.cc&&a.oamt===b.oamt);

/* why two expenses look like duplicates, or '' if they don't */
function dupReason(a,b){
  if(!a||!b||a.id===b.id||a.del||b.del||isPay(a)||isPay(b))return '';
  if((a.notdup||[]).includes(b.id)||(b.notdup||[]).includes(a.id))return '';
  if(!sameAmount(a,b))return '';
  const gap=dayGap(a.date,b.date);if(gap>2)return '';
  const wa=shopWords(a.desc),wb=shopWords(b.desc);
  if(wa.length&&wb.length)return wa.some(w=>wb.includes(w))?'Same amount and shop':'';
  if(gap!==0)return '';
  const ca=dupCat(a),cb=dupCat(b);
  if(ca&&cb&&ca!==cb)return '';
  if(!wa.length&&!wb.length&&normTxt(a.desc)!==normTxt(b.desc)&&!(ca&&ca===cb))return '';
  return 'Same amount, same day';
}
const findDups=c=>expenses().filter(e=>dupReason(c,e)).map(e=>({e,why:dupReason(c,e)}));
function dupPairs(){

}

/* Phones often store portrait photos sideways plus an EXIF "orientation" tag. Most browsers apply it when drawing,
   some don't; read the tag and the stored size, and turn the picture upright ourselves when the browser hasn't. */
function jpegInfo(buf){
  const v=new DataView(buf);let o=2,orient=1,w=0,h=0;
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {orient,w,h};
  while(o+4<=v.byteLength){
    const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&o+10<v.byteLength&&v.getUint32(o+4)===0x45786966){            /* "Exif" */
      const t=o+10,le=v.getUint16(t)===0x4949,ifd=t+v.getUint32(t+4,le),n=v.getUint16(ifd,le);
      for(let i=0;i<n;i++){const e=ifd+2+i*12;if(e+10>v.byteLength)break;if(v.getUint16(e,le)===0x0112){orient=v.getUint16(e+8,le);break}}
    }
    if(m>=0xFFC0&&m<=0xFFC3){h=v.getUint16(o+5);w=v.getUint16(o+7);break}
    if((m&0xFF00)!==0xFF00||len<2)break;
    o+=2+len;
  }
  return {orient,w,h};
}

function turnsNeeded(info,iw,ih){

  const notApplied=iw===info.w&&ih===info.h;                                  /* still the stored (sideways) size */
  if(!notApplied)return 0;
  return info.orient===6?1:info.orient===8?3:info.orient===3?2:0;
}
function imgDims(d){return new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth||i.width,i.naturalHeight||i.height]);i.onerror=()=>r(null);setTimeout(()=>r(null),3000);i.src=d})}
/* a JPEG data URL turned clockwise by quarter turns */
function turnData(d,turns,q=0.8){return new Promise(r=>{const i=new Image();
  i.onload=()=>{try{const c=document.createElement('canvas'),x=c.getContext('2d'),w=i.naturalWidth,h=i.naturalHeight;
    if(turns%2){c.width=h;c.height=w}else{c.width=w;c.height=h}
    x.translate(c.width/2,c.height/2);x.rotate(turns*Math.PI/2);x.drawImage(i,-w/2,-h/2);r(c.toDataURL('image/jpeg',q))}catch(e){r(null)}};
  i.onerror=()=>r(null);setTimeout(()=>r(null),3000);i.src=d})}
async function compress(file,max=1400,q=0.7){
  let info=null;try{info=jpegInfo(await file.slice(0,256*1024).arrayBuffer())}catch(e){}
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const turns=turnsNeeded(info,img.naturalWidth||img.width,img.naturalHeight||img.height);
      const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas'),x=c.getContext('2d');
      if(turns%2){c.width=h;c.height=w}else{c.width=w;c.height=h}
      x.translate(c.width/2,c.height/2);x.rotate(turns*Math.PI/2);x.drawImage(img,-w/2,-h/2,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}
function queuePhoto(id,v,data){
  try{localStorage.setItem(PH+id,JSON.stringify({t:S.id,v,data,pe:S.pk?1:0}))}catch(e){toast('Phone storage is full. Photo not saved.')}
  uploadPhotos();
}
function localPhoto(id,v){try{const x=JSON.parse(localStorage.getItem(PH+id));return x&&x.v===v?x.data:null}catch(e){return null}}
const photoUrls={};
async function photoURL(id,v,pe){
  const local=localPhoto(id,v);if(local)return local;
  const k=`${S.id}/${id}?v=${v}`;if(photoUrls[k])return photoUrls[k];
  const r=await fetch(`/api/photo/${k}`);if(!r.ok)throw new Error(r.status);
  let b=new Uint8Array(await r.arrayBuffer());
  if(pe)b=await unseal(S.pk,b);
  return photoUrls[k]=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));
}
const dataBlob=d=>{const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})};
let uploading=false;
async function uploadPhotos(){
  if(!syncAvail||!prefs.sync||uploading)return;uploading=true;
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PH))keys.push(k)}
  for(const k of keys){
    try{const x=JSON.parse(localStorage.getItem(k)),id=k.slice(PH.length),url=`/api/photo/${x.t}/${id}`;
      const tr=x.t===S.id?S:loadTrip(x.t);if(x.pe&&!(tr&&tr.pk))continue;
      const body=x.pe?new Blob([await seal(tr.pk,new Uint8Array(await dataBlob(x.data).arrayBuffer()))]):dataBlob(x.data);
      const r=await fetch(url,{method:'PUT',headers:{'content-type':x.pe?'application/octet-stream':'image/jpeg'},body});
      if(r.ok){localStorage.removeItem(k);fetch(`${url}?v=${x.v}`).catch(()=>{})}
    }catch(e){break}
  }
  uploading=false;
}

/* ---- Spreadsheet export ---- */
function exportCsv(){
  const q=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},n=p=>(p/100).toFixed(2),P=people();
  const head=['Date','Description','Type','Category','Paid by',`Amount (${S.cur})`,'Original currency','Original amount','Rate','Split between',...P.map(p=>`${p.name} share`)];
  const rows=expenses().slice().reverse().map(e=>{const pay=isPay(e),sh=pay?{}:shares(e);
    return [e.date,pay?`${pname(e.paidBy)} paid ${pname(e.for[0])}`:e.desc,pay?'Payment':'Expense',pay?'':CAT_NAME[e.cat],pname(e.paidBy),n(e.amt),e.cc||'',e.cc?n(e.oamt):'',e.rate||'',e.for.map(pname).join('; '),...P.map(p=>sh[p.id]?n(sh[p.id]):'')]});
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const name=(S.name.replace(/[^\w\- ]+/g,'').trim()||'trip')+'.csv';
  const file=new File([csv],name,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:S.name}).catch(()=>{});
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Spreadsheet saved');
}

/* Import: {"people":[names],"expenses":[[id,date,desc,amount,payerName,cat?,[forNames]?]]}.
   People match by name; missing people are added. No "for" list = split between everyone. Same id = skipped, so re-importing is safe. */
function importData(txt){
  let d;
  try{d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1))}catch(e){}
  if(!d||!Array.isArray(d.expenses)){toast('That isn\'t import text');return false}
  if(S.sample){S=blank();open=null}
  const find=n=>people().find(p=>p.name.trim().toLowerCase()===String(n).trim().toLowerCase());
  const ensure=n=>find(n)||(S.people.push({id:uid(),name:String(n).trim(),c:nextColor(),u:now()}),find(n));
  (d.people||[]).forEach(ensure);
  if(d.cur&&!expenses().length){S.cur=d.cur;S.nu=now()}
  let added=0;
  d.expenses.forEach(([id,date,desc,amt,payer,cat,forNames])=>{
    id=String(id);if(S.expenses.some(e=>e.id===id)||!(amt>0))return;
    const f=Array.isArray(forNames)&&forNames.length?forNames.map(n=>ensure(n).id):people().map(p=>p.id);
    S.expenses.push({id,desc:String(desc),amt:Math.round(amt*100),date:date||today(),paidBy:ensure(payer).id,for:f,cat:CATS.includes(cat)?cat:guessCat(desc),u:now()});
    added++;
  });
  save();tab='exp';open=null;render();
  toast(added?`Imported ${added} expense${added>1?'s':''}`:'Nothing new to import');
  return true;
}
/* ---- Sheets: close with the arrow, a swipe down on the top bar, the phone's back gesture, Esc, or a tap outside ---- */
let popIgnoreUntil=0;
function openScrim(){
  const sc=$('#scrim');
  if(sc.hidden){sc.hidden=false;try{history.pushState({sheet:1},'')}catch(e){}}
  return sc;
}
function close(){
  const sc=$('#scrim');if(sc.hidden)return;
  sc.hidden=true;sc.innerHTML='';
  /* step back over the entry we added; its popstate arrives shortly after and must not close a sheet opened meanwhile */
  if(history.state&&history.state.sheet){popIgnoreUntil=Date.now()+400;history.back()}
}
window.addEventListener('popstate',()=>{
  if(Date.now()<popIgnoreUntil)return;
  const sc=$('#scrim');if(!sc.hidden){sc.hidden=true;sc.innerHTML=''}  /* back gesture */
});
function enhanceSheet(sh){
  if(sh.dataset.enh)return;sh.dataset.enh=1;
  const g=document.createElement('div');g.className='grab';g.setAttribute('aria-hidden','true');sh.prepend(g);
  let y0=null,dy=0,t0=0;
  const inZone=e=>e.target.closest('.grab,.sh')&&!e.target.closest('input,select,textarea');
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0||!inZone(e))return;y0=e.touches[0].clientY;dy=0;t0=Date.now();sh.style.transition='none'},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=dy?`translateY(${dy}px)`:''},{passive:true});
  const end=()=>{if(y0==null)return;y0=null;const v=dy/Math.max(1,Date.now()-t0);sh.style.transition='transform .2s ease';
    if(dy>90||(dy>30&&v>0.6)){sh.style.transform='translateY(100%)';setTimeout(close,180)}else sh.style.transform=''};
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);
}
new MutationObserver(()=>{const sh=$('#scrim .sheet');if(sh)enhanceSheet(sh)}).observe($('#scrim'),{childList:true});
document.addEventListener('click',e=>{if(e.target.closest('[data-dismiss]'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)close()});
