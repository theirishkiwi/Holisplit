<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Holiday Split</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, three tabs, a round green add button bottom right. Soft pastels; avatars and icons carry meaning instead of text. */
:root{
  --bg:#f6f7fb;--card:#ffffff;--fg:#232838;--muted:#767d92;--line:#e6e8f0;--tile:#f0f2f8;
  --accent:#5c6cc9;--soft:#e3e7fb;--soft-ink:#2c3670;
  --go:#3fb27a;--wa:#cdeedb;--wa-ink:#1d5a3a;
  --pos:#2f9461;--neg:#cf5a62;--note:#fff1d9;--note-ink:#6e5317;
  --display:"Outfit",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151c;--card:#1c1f29;--fg:#e9ebf3;--muted:#949ab0;--line:#2a2e3b;--tile:#252937;
  --accent:#a3b0f5;--soft:#2c3358;--soft-ink:#dfe4ff;
  --go:#3fb27a;--wa:#1f3d2d;--wa-ink:#bdebd0;
  --pos:#7fd4a5;--neg:#f19aa0;--note:#3a311b;--note-ink:#f3dba4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151c;--card:#1c1f29;--fg:#e9ebf3;--muted:#949ab0;--line:#2a2e3b;--tile:#252937;
  --accent:#a3b0f5;--soft:#2c3358;--soft-ink:#dfe4ff;
  --go:#3fb27a;--wa:#1f3d2d;--wa-ink:#bdebd0;
  --pos:#7fd4a5;--neg:#f19aa0;--note:#3a311b;--note-ink:#f3dba4;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{display:flex;align-items:center;gap:8px;padding-block:18px 12px}
#trip{flex:1;min-width:0;font:700 1.6rem/1.2 var(--display);background:none;border:0;padding:4px 0}
#trip:focus{outline:none;border-bottom:1px dashed var(--line)}
.iconbtn{border:0;background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--muted);flex:none}

.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--note);color:var(--note-ink);border-radius:14px;padding:8px 8px 8px 14px;font-size:.9rem;font-weight:500;margin-bottom:12px}
.banner span{flex:1;min-width:10em}
.banner .bb{display:flex;gap:6px}
.banner button{background:var(--card);border:0;color:var(--fg);border-radius:9px;padding:7px 12px;font-weight:600}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;box-shadow:0 1px 0 var(--line)}
.tabs button{border:0;background:none;border-radius:10px;padding:9px 0;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--soft-ink)}

/* avatars: pastel fill, dark initial */
.av{--s:30px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#2a2f3d;font:700 calc(var(--s)*.46)/1 var(--display);flex:none}
.av.sm{--s:22px}.av.lg{--s:40px}
.stack{display:inline-flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--card)}
.stack .av+.av{margin-left:-7px}
.who{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.8rem;margin-top:3px}
.who svg.i{width:14px;height:14px}

.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}
.bar b{font:700 1.7rem var(--display)}
.ghost{border:0;background:none;color:var(--accent);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px;padding:6px 4px}

.day{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.dayh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:13px 14px;font-weight:600;text-align:left}
.dayh .d{flex:1}
.dayh .s{color:var(--muted);font-weight:500}
.dayh svg.i{color:var(--muted);transition:transform .15s}
.day.open .dayh svg.i{transform:rotate(90deg)}
.items{list-style:none;margin:0;padding:0 6px 6px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:9px 8px}
button.row:hover{background:var(--tile)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#3a4052}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:48px 10px}

h2{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px}
.card{background:var(--card);border-radius:16px;padding:6px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.flow{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600;flex-wrap:wrap}
.flow svg.i{color:var(--muted)}
.square{padding:18px;text-align:center;color:var(--muted);font-weight:500}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;background:var(--card);border-radius:14px;padding:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.primary{background:var(--soft);color:var(--soft-ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.danger{color:var(--neg);background:var(--tile)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:8px 0 0}

.addp{display:flex;gap:8px;margin-top:14px}
.addp input{flex:1;min-width:0}
.field{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;width:100%}
.x{border:0;background:none;color:var(--muted);padding:8px}
.msg{color:var(--neg);font-size:.88rem;margin:6px 4px 0}
.msg:empty{display:none}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--go);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgb(30 110 70 / .32);z-index:3}
.fab svg.i{width:30px;height:30px;stroke-width:2.6}

.scrim{position:fixed;inset:0;background:rgb(10 12 20 / .4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
@supports (height:1dvh){.sheet{max-height:94dvh}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h3{margin:0;font:700 1.25rem var(--display)}
.sh input{border:0;background:var(--card);border-radius:10px;padding:7px 9px;font-size:.9rem}
.big{font:700 2rem var(--display)!important;text-align:center;padding:14px!important}
.descrow{display:flex;gap:8px;position:relative}
.descrow input{flex:1;min-width:0}
.catbtn{border:0;border-radius:12px;width:52px;display:flex;align-items:center;justify-content:center;gap:2px;flex:none;color:#3a4052}
.catbtn.none{background:var(--tile);color:var(--muted)}
.catbtn .caret{width:12px;height:12px;transform:rotate(90deg);opacity:.6}
.catmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border-radius:16px;box-shadow:0 12px 32px rgb(10 14 30 / .2);padding:8px;display:grid;grid-template-columns:repeat(4,46px);gap:6px;z-index:5}
.cat{border:2px solid transparent;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;color:#3a4052}
.cat[aria-pressed="true"]{border-color:var(--accent)}
.pick{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 2px;scrollbar-width:none}
.pa{border:0;background:none;padding:0;flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.38;filter:saturate(.5);transition:opacity .12s}
.pa .av{border-radius:50%}
.pa[aria-pressed="true"]{opacity:1;filter:none}
.pa[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.pn{font-size:.75rem;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.two{font-size:calc(var(--s)*.38);letter-spacing:-.02em}
.lbl em{font-style:normal;color:var(--fg);text-transform:none;letter-spacing:0;font-size:.9rem;margin-left:6px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:-6px}
.lbl button{background:none;border:0;color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;display:inline-flex;align-items:center;gap:7px;opacity:.5}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--accent)}
.each{color:var(--muted);font-size:.85rem;text-align:center;min-height:1.2em}
.sheet .foot{display:flex;gap:10px}
.sheet .foot .primary{flex:1}

/* settings */
.set{background:var(--card);border-radius:16px;padding:4px 14px}
.set>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set>div:last-child{border-bottom:0}
.set .col{flex-direction:column;align-items:stretch;gap:8px}
.set label{font-weight:600}
.set small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.set input.field,.set textarea.field{padding:10px}
.set textarea.field{resize:vertical;font:13px/1.4 ui-monospace,monospace}
.cur{width:4em;text-align:center}
.sw{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .15s}
.sw:checked{background:var(--go)}
.sw:checked::after{transform:translateX(20px)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;font-weight:500;z-index:20;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
/* sync + trips */
#cloud[data-s="ok"]{color:var(--go)}
#cloud[data-s="offline"]{opacity:.45}
@media (prefers-reduced-motion:no-preference){#cloud[data-s="sync"] svg{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.set .trip{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-weight:600;border-bottom:1px solid var(--line)}
.set .trip:last-child{border-bottom:0}
.set .trip svg.i{color:var(--go)}
.set .trip.newt{color:var(--accent);justify-content:flex-start}
.status{font-size:.8rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-top:16px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--soft-ink)}
.row.pickme{outline:2px dashed var(--accent);outline-offset:-2px}
.row.linking,.x[aria-pressed="true"]{color:var(--accent)}
.pickhint{color:var(--accent);font-weight:600;text-align:center;margin:12px 0 0}
svg.i.tiny{width:14px;height:14px;vertical-align:-2px}
.invite{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
/* me card */
.mecard{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:14px 16px;margin-top:14px;color:var(--fg)}
.mehead{font:600 .95rem var(--body);color:var(--muted);margin-bottom:4px}
.mebig{font:700 1.35rem/1.25 var(--display)}
.melines{margin-top:6px;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:.9rem}
.melines b{color:var(--fg);font-weight:600}
/* rows: right column with amount + my position */
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.mine{font-size:.75rem;font-weight:600;white-space:nowrap}
.mine.none{color:var(--muted);font-weight:500}
.orig{margin-left:4px}
.paidbtn{border:0;background:var(--wa);color:var(--wa-ink);border-radius:8px;padding:4px 10px;font-size:.78rem;font-weight:700}
/* currency */
.amtrow{display:flex;gap:8px;position:relative}
.amtrow input{flex:1;min-width:0}
.ccbtn{border:0;border-radius:12px;min-width:64px;padding:0 10px;background:var(--card);font:700 1.3rem var(--display);flex:none;color:var(--fg)}
.ccmenu{position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border-radius:16px;box-shadow:0 12px 32px rgb(10 14 30 / .2);padding:8px;display:grid;grid-template-columns:repeat(5,48px);gap:6px;z-index:5}
.ccmenu button{border:2px solid transparent;background:var(--tile);border-radius:10px;height:44px;font:700 1rem var(--display);color:var(--fg)}
.ccmenu button[aria-pressed="true"]{border-color:var(--accent)}
.raterow{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.raterow input{width:6.5em;padding:9px 10px}
.raterow .conv{color:var(--muted);font-weight:500}
/* photo */
.shr{display:flex;gap:8px;align-items:center}
.thumbrow{display:flex;align-items:center;gap:10px}
.thumb{border:0;padding:0;background:var(--tile);border-radius:12px;width:72px;height:72px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;background:rgb(0 0 0 / .92);z-index:40;display:grid;place-items:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.viewer .iconbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.by{color:var(--muted);font-size:.8rem;text-align:center;margin:0}
/* summary */
.sums{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.sumrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center}
.sumrow .ic{width:28px;height:28px;border-radius:8px}
.sumrow .ic svg.i{width:16px;height:16px}
.sumrow .lab{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumrow .v{font-weight:700}
.track{grid-column:2 / 4;height:8px;border-radius:4px;background:var(--tile);overflow:hidden}
.fill{display:block;height:100%;border-radius:4px}
.btn.wide{width:100%;margin-top:14px}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <input id="trip" type="text" aria-label="Trip name">
    <button class="iconbtn" id="cloud" aria-label="Sync now" hidden><svg class="i"><use href="#i-cloud"/></svg></button>
    <button class="iconbtn" id="gear" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <div class="banner" id="deleted" hidden><span id="delText"></span><button id="restoreBtn">Restore</button></div>
  <div class="banner" id="revoked" hidden><span>This trip's link was reset. Open the new link from the group to keep syncing. Your changes will carry over.</span></div>
  <div class="banner" id="sample" hidden><span>Example trip</span><button id="clearSample">Start fresh</button></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="exp">Expenses</button>
    <button role="tab" data-tab="bal">Settle up</button>
    <button role="tab" data-tab="ppl">Group</button>
  </nav>
  <section id="exp"></section>
  <section id="bal" hidden></section>
  <section id="ppl" hidden></section>
</div>
<button class="fab" id="add" aria-label="Add expense"><svg class="i"><use href="#i-plus"/></svg></button>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="c-food" viewBox="0 0 24 24"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M18 21V3c-2.5 1-4 3.5-4 7v4h4"/></symbol>
  <symbol id="c-groceries" viewBox="0 0 24 24"><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L21 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></symbol>
  <symbol id="c-drinks" viewBox="0 0 24 24"><path d="M5 4h14l-7 8zM12 12v8M8 20h8"/></symbol>
  <symbol id="c-transport" viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7 17v3M17 17v3"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/></symbol>
  <symbol id="c-stay" viewBox="0 0 24 24"><path d="M3 19V5M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="1.8"/></symbol>
  <symbol id="c-activity" viewBox="0 0 24 24"><path d="M3 8a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2a2 2 0 0 0 0 4v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a2 2 0 0 0 0-4zM14 7v2M14 11v2M14 15v2"/></symbol>
  <symbol id="c-other" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4.3 4.3 0 0 1-.5 8.5z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-unlink" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1M4 4l16 16"/></symbol>
  <symbol id="i-pay" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>

<script>
/* Data model: every person/expense has an id and updatedAt (u); deletes are tombstones (del). Amounts in pence.
   Sync: each trip lives on the Worker at /api/trip/<id>. Phones GET to pull, PUT to push; the server merges, newest u wins. */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const newId=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,b=>(b%36).toString(36)).join('')};
const TRIP_ID=/^[a-z0-9]{12,40}$/;
const now=()=>Date.now();
/* dates are the phone's local calendar day (toISOString would give UTC, i.e. yesterday just after midnight in Italy) */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(id,cls='i')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;

const COLORS=['#ffcfb3','#bfe6c9','#bcd8f5','#dccbf3','#f8c3cd','#b2e3df','#f6e1a6','#ccd1f7'];
const CATS=['food','groceries','drinks','transport','stay','activity','other'];
const CAT_COL={food:'#ffdcc7',groceries:'#cdeed7',drinks:'#f9d3dc',transport:'#cfe2f8',stay:'#e3d6f6',activity:'#f8e8b8',other:'#dde1ea'};
const CAT_RX={
  groceries:/super|market|grocer|shop|tesco|lidl|aldi|mercadona|carrefour|spar|co-?op|conad|eurospin|coop|esselunga|bakery/i,
  drinks:/drink|bar\b|beer|wine|pub|cocktail|coffee|caf[eé]|gin/i,
  food:/dinner|lunch|breakfast|brunch|meal|restaurant|tapas|pizza|food|snack|ice ?cream|takeaway|burger|sushi/i,
  transport:/taxi|uber|bolt|bus|train|car\b|hire|fuel|petrol|diesel|parking|flight|ferry|transfer|airport|toll|metro/i,
  stay:/hotel|airbnb|villa|apartment|hostel|room|stay|accommodation/i,
  activity:/ticket|boat|tour|museum|entry|excursion|golf|surf|kayak|show|beach|spa|park/i
};
const CAT_NAME={food:'Food',groceries:'Groceries',drinks:'Drinks',transport:'Transport',stay:'Stay',activity:'Activities',other:'Other'};
const CAT_FILL={food:'#f4a578',groceries:'#79c995',drinks:'#ec8fa5',transport:'#7fafe8',stay:'#ac94e3',activity:'#e3bf50',other:'#a3aabb'};
const PAY_COL='#d6f1e2',CCS=['€','£','$','CHF','kr','zł','Kč','Ft','¥','₺'];
const matchCat=d=>CATS.find(c=>CAT_RX[c]&&CAT_RX[c].test(d));
const guessCat=d=>matchCat(d)||'other';

function sample(){
  const P=['Chris','Sam','Alex','Jo'].map((n,i)=>({id:uid(),name:n,c:i,u:now()}));
  P[0].pair=P[1].id;P[1].pair=P[0].id;P[2].pair=P[3].id;P[3].pair=P[2].id;
  const [c,s,a,j]=P.map(p=>p.id), d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)};
  const E=[
    ['Tapas dinner',8640,d(0),c,[c,s,a,j]],
    ['Beach bar',2450,d(0),s,[c,s,a,j]],
    ['Mercadona',4215,d(1),s,[c,s,a,j]],
    ['Boat trip',6000,d(1),a,[c,a]],
    ['Taxi from airport',3800,d(2),j,[c,s,a,j]],
    ['Villa deposit',30000,d(2),c,[c,s,a,j]],
  ].map(([desc,amt,date,paidBy,f])=>({id:uid(),desc,amt,date,paidBy,for:f,cat:guessCat(desc),u:now()}));
  return {v:1,id:'sample',name:'Spain 2026',cur:'€',nu:0,sample:true,people:P,expenses:E,u:now()};
}
const blank=()=>({v:1,id:newId(),key:randKey(),pk:randKey(),name:'My trip',cur:'£',nu:now(),people:[],expenses:[],u:now(),dirty:true});
const fix=t=>{t.people=t.people||[];t.expenses=t.expenses||[];
  const used=new Set();t.expenses.forEach(e=>{if(!e.del){used.add(e.paidBy);(e.for||[]).forEach(i=>used.add(i))}});
  t.people.forEach(p=>{if(p.del&&used.has(p.id))delete p.del});
  t.people.forEach((p,i)=>{if(p.c==null)p.c=i%COLORS.length});t.expenses.forEach(e=>{if(!e.cat)e.cat=guessCat(e.desc)});if(t.nu==null)t.nu=0;return t};

/* ---- Local storage: one key per trip, plus device prefs (current trip, trip list, sync on/off) ---- */
const TK=id=>'hs-trip-'+id, PKEY='holiday-split-prefs';
let prefs={sync:true,cur:null,trips:[]};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PKEY))||{})}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PKEY,JSON.stringify(prefs))}catch(e){}};
const loadTrip=id=>{try{const t=JSON.parse(localStorage.getItem(TK(id)));return t&&t.v?fix(t):null}catch(e){return null}};
function persist(){
  try{localStorage.setItem(TK(S.id),JSON.stringify(S))}catch(e){}
  if(!S.sample){const l=prefs.trips.find(t=>t.id===S.id);if(l){l.name=S.name;l.del=S.del||null}else prefs.trips.unshift({id:S.id,name:S.name,del:S.del||null})}
  prefs.cur=S.id;savePrefs();
}
/* Deleted trips: kept for 30 days so they can be restored, then removed from the phone (and expire on the server) */
const KEEP_DELETED=30*864e5;
const goneAt=t=>t.del||t.local||0;
const daysLeft=t=>Math.max(0,Math.ceil((goneAt(t)+KEEP_DELETED-now())/864e5));
function purgeDeleted(){
  prefs.trips=prefs.trips.filter(t=>{if(goneAt(t)&&now()-goneAt(t)>KEEP_DELETED){try{localStorage.removeItem(TK(t.id))}catch(e){}return false}return true});
  savePrefs();
}
/* migrate the earlier single-trip save */
try{const old=JSON.parse(localStorage.getItem('holiday-split-v1'));
  if(old&&old.v){if(old.sample)old.id='sample';else if(!TRIP_ID.test(old.id)){old.id=newId();old.dirty=true}
    fix(old);localStorage.setItem(TK(old.id),JSON.stringify(old));if(!old.sample)prefs.trips.unshift({id:old.id,name:old.name});prefs.cur=old.id;savePrefs()}
  localStorage.removeItem('holiday-split-v1')}catch(e){}

purgeDeleted();
const firstLive=()=>prefs.trips.find(t=>!goneAt(t)&&loadTrip(t.id));
let S=(prefs.cur&&!(prefs.trips.find(t=>t.id===prefs.cur)||{}).local&&loadTrip(prefs.cur))||fix(sample());

/* every user edit goes through save(): marks the trip as needing a push */
let seq=0;
const save=()=>{S.u=now();S.dirty=true;seq++;persist();kick()};

/* ---- Sync ---- */
let syncAvail=false,syncing=false,again=false,kickT;
const api=id=>'/api/trip/'+id;
const syncOn=()=>syncAvail&&prefs.sync&&!S.sample&&!S.revoked;
/* ---- End-to-end encryption ----
   Each trip has a random 256-bit key that lives only in the invite link (#id.key) and on phones; the server stores
   AES-GCM ciphertext it cannot read. Photos use a second key (pk) kept inside the encrypted trip. */
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function randKey(){return b64u(crypto.getRandomValues(new Uint8Array(32)))}
const keyCache={};
const cryptoKey=k=>keyCache[k]||(keyCache[k]=crypto.subtle.importKey('raw',ub64u(k),'AES-GCM',false,['encrypt','decrypt']));
async function seal(k,bytes){
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await cryptoKey(k),bytes));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;
}
async function unseal(k,bytes){bytes=new Uint8Array(bytes);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(0,12)},await cryptoKey(k),bytes.subarray(12)))}
/* what leaves the phone: never the link key, server revision or phone-only flags */
const tripOut=t=>{const {sample,dirty,lastPayer,revoked,key,rev,...x}=t;return x};
const payload=()=>tripOut(S);
async function encTrip(t){
  const env={v:2,id:t.id,rev:t.rev||0,enc:b64u(await seal(t.key,new TextEncoder().encode(JSON.stringify(tripOut(t)))))};
  if(t.prev)env.prev=t.prev;if(t.del)env.del=t.del;return env;
}
async function decTrip(env,key){
  const t=JSON.parse(new TextDecoder().decode(await unseal(key,ub64u(env.enc))));
  t.id=env.id;t.key=key;t.rev=env.rev;if(env.prev)t.prev=env.prev;return fix(t);
}
/* true when this phone holds something the server copy lacks (a missed or lost write) */
function ahead(loc,rem){
  if(!rem)return true;if((loc.nu||0)>(rem.nu||0)||(loc.du||0)>(rem.du||0))return true;
  return ['people','expenses'].some(k=>loc[k].some(x=>{const r=(rem[k]||[]).find(y=>y.id===x.id);return !r||(x.u||0)>(r.u||0)}));
}
const ready=fetch('/api/ping',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{syncAvail=!!(j&&j.ok)}).catch(()=>{}).then(()=>{setNet(syncOn()?'sync':'off');sync()});
function setNet(s){const c=$('#cloud');c.hidden=!syncOn();c.dataset.s=s;c.setAttribute('aria-label',{ok:'Synced',sync:'Syncing',offline:'Offline. Tap to retry'}[s]||'Sync')}
function kick(){clearTimeout(kickT);kickT=setTimeout(sync,500)}
async function sync(){
  if(!syncOn())return;
  if(syncing){again=true;return}
  syncing=true;setNet('sync');
  const trip=S,sent=seq,hdr={'content-type':'application/json'};
  const gone=()=>{if(S===trip){S.revoked=true;persist();render()}setNet('off')};
  try{
    if(trip.key){
      /* encrypted: pull + merge on the phone, then push with the revision we merged from; 409 = someone else saved first */
      let r=await fetch(api(trip.id),{cache:'no-store'}),remote=null;
      if(r.status===410)return gone();
      if(r.ok){const env=await r.json();remote=await decTrip(env,trip.key);trip.rev=env.rev;if(S===trip)mergeIn(remote)}
      else if(r.status!==404)throw new Error(r.status);
      for(let i=0;i<4&&(trip.dirty||ahead(trip,remote));i++){
        r=await fetch(api(trip.id),{method:'PUT',headers:hdr,body:JSON.stringify(await encTrip(trip))});
        if(r.status===410)return gone();
        if(r.status===409){const env=(await r.json()).current;remote=await decTrip(env,trip.key);trip.rev=env.rev;if(S===trip)mergeIn(remote);continue}
        if(!r.ok)throw new Error(r.status);
        trip.rev=(await r.json()).rev;if(seq===sent)trip.dirty=false;if(S===trip)persist();break;
      }
    }else{
      const put=()=>fetch(api(trip.id),{method:'PUT',headers:hdr,body:JSON.stringify(tripOut(trip))});
      let r=trip.dirty?await put():await fetch(api(trip.id),{cache:'no-store'});
      if(r.status===404)r=await put();
      if(r.status===410)return gone();
      if(!r.ok)throw new Error(r.status);
      const remote=await r.json();
      if(S===trip){if(seq===sent)S.dirty=false;mergeIn(remote);if(ahead(S,remote)){S.dirty=true;again=true}}
    }
    setNet('ok');uploadPhotos();
  }catch(e){setNet('offline')}
  finally{syncing=false}
  if(again||(S.dirty&&seq!==sent)){again=false;kick()}
}
/* merge a remote copy into the open trip; newest u wins */
function mergeIn(t){
  let added=0,changed=0;
  ['people','expenses'].forEach(k=>(t[k]||[]).forEach(x=>{
    const l=S[k].find(y=>y.id===x.id);
    if(!l){S[k].push(x);changed++;if(!x.del&&k==='expenses')added++}
    else if((x.u||0)>(l.u||0)){Object.assign(l,x);changed++}
  }));
  if((t.nu||0)>(S.nu||0)){S.name=t.name;S.cur=t.cur;S.nu=t.nu;changed++}
  if(!S.pk&&t.pk)S.pk=t.pk;
  if((t.du||0)>(S.du||0)){S.del=t.del||null;S.delBy=t.delBy||null;S.du=t.du;changed++}
  fix(S);persist();
  if(changed){if(open&&added)expenses().forEach(e=>open.add(e.date));render();if(added)toast(`${added} new from the group`)}
}
setInterval(()=>{if(!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
window.addEventListener('online',sync);

/* ---- Trips: switch, create, join by link ---- */
function switchTo(t){const l=prefs.trips.find(x=>x.id===t.id);if(l)l.local=null;S=fix(t);open=null;tab='exp';persist();render();setNet(syncOn()?'sync':'off');sync()}
/* ---- Reset invite link: copy the trip to a new ID, then the server turns the old ID off ---- */
function retargetPhotos(from,to){
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PH))keys.push(k)}
  keys.forEach(k=>{try{const x=JSON.parse(localStorage.getItem(k));if(x.t===from){x.t=to;localStorage.setItem(k,JSON.stringify(x))}}catch(e){}});
}
/* bring a superseded local copy into the open trip: anything newer or missing wins, then forget the old copy */
function adopt(old){
  let n=0;
  ['people','expenses'].forEach(k=>(old[k]||[]).forEach(x=>{const l=S[k].find(y=>y.id===x.id);
    if(!l){S[k].push(x);n++}else if((x.u||0)>(l.u||0)){Object.assign(l,x);n++}}));
  prefs.me=prefs.me||{};if(prefs.me[old.id]&&!prefs.me[S.id])prefs.me[S.id]=prefs.me[old.id];delete prefs.me[old.id];
  retargetPhotos(old.id,S.id);
  try{localStorage.removeItem(TK(old.id))}catch(e){}
  prefs.trips=prefs.trips.filter(t=>t.id!==old.id);
  fix(S);if(n)save();else persist();render();
}
async function resetLink(){
  if(!syncOn())return toast('This needs a connection');
  const before=S,from=S.id,hdr={'content-type':'application/json'};
  const t={...tripOut(S),id:newId(),prev:from,key:randKey(),pk:S.pk||randKey(),rev:0};
  try{
    let r=await fetch(api(t.id),{method:'PUT',headers:hdr,body:JSON.stringify(await encTrip(t))});
    if(!r.ok)throw 0;
    r=await fetch(api(from)+'/move',{method:'POST',headers:hdr,body:JSON.stringify({to:t.id})});
    if(!r.ok)throw 0;
    S=await decTrip(await r.json(),t.key);adopt(before);
    toast(before.key?'New link ready. Send it to the group.':'Trip encrypted. Send the new link to the group.');tab='ppl';render();
  }catch(e){S=before;toast('Couldn\'t do that. Check your connection and try again.')}
}
/* ---- Delete & restore ---- */
const waitIdle=async()=>{for(let i=0;i<100&&syncing;i++)await new Promise(r=>setTimeout(r,50))};
function leaveTo(){const t=firstLive();switchTo(t?loadTrip(t.id):fix(sample()))}
async function deleteForEveryone(){
  if(!syncOn())return toast('Deleting for everyone needs a connection');
  const trip=S;
  trip.del=now();trip.delBy=me()||null;trip.du=now();save();
  await waitIdle();await sync();
  if(S!==trip||trip.dirty){trip.del=null;trip.delBy=null;trip.du=now();save();render();return toast('Couldn\'t delete. Check your connection and try again.')}
  const id=trip.id;leaveTo();
  toast(`Deleted ${trip.name}`,{label:'Undo',fn:()=>restoreTrip(id)});
}
function removeFromPhone(){
  const trip=S,l=prefs.trips.find(t=>t.id===trip.id);
  if(trip.sample){S=fix(sample());S.id='sample';persist();render();return toast('Example trip reset')}
  if(l){l.local=now();savePrefs()}
  leaveTo();
  toast(`Removed ${trip.name} from this phone`,{label:'Undo',fn:()=>restoreTrip(trip.id)});
}
function restoreTrip(id){
  const l=prefs.trips.find(t=>t.id===id),t=loadTrip(id);
  if(!t)return toast('That trip is no longer on this phone');
  if(l)l.local=null;
  switchTo(t);
  if(S.del){S.del=null;S.delBy=null;S.du=now();save()}
  render();toast(`Restored ${S.name}`);
}
function openDelete(){
  const sc=$('#scrim');sc.hidden=false;
  const shared=!S.sample&&syncOn();
  sc.innerHTML=`<div class="sheet" role="dialog" aria-label="Delete trip">
    <div class="sh"><h3>Delete “${esc(S.name)}”?</h3><button class="iconbtn" id="dclose" aria-label="Cancel">${ico('i-x')}</button></div>
    <div class="set">
      <div class="col"><label>Remove from this phone<small>${shared?'The group keeps it. ':''}You can restore it from Settings for 30 days${shared?', or open the invite link again':''}.</small></label>
        <button class="btn" id="dlocal">Remove from this phone</button></div>
      ${shared?`<div class="col"><label>Delete for everyone<small>Removes it from every phone in the group. Anyone can restore it from the trip or from Settings for 30 days, after which it's gone for good.</small></label>
        <button class="btn danger" id="dall">Delete for everyone</button></div>`:''}
    </div>
    <button class="btn" id="dcancel">Cancel</button>
  </div>`;
  sc.onclick=e=>{
    if(e.target===sc||e.target.closest('#dclose')||e.target.closest('#dcancel'))return close();
    if(e.target.closest('#dlocal')){close();removeFromPhone();return}
    const da=e.target.closest('#dall');
    if(da){if(!da.dataset.armed){da.dataset.armed=1;da.textContent='Tap again to delete for everyone';return}close();deleteForEveryone()}
  };
}
$('#restoreBtn').onclick=()=>restoreTrip(S.id);
function newTrip(){switchTo(blank());tab='ppl';render();setTimeout(()=>$('#pname')?.focus(),50)}
const tripLink=()=>location.origin+location.pathname+'#'+S.id+(S.key?'.'+S.key:'');
async function join(id,key){
  if(id===S.id&&(!key||S.key===key))return;
  const cached=loadTrip(id);if(cached&&(!key||cached.key===key))return switchTo(cached);
  await ready;
  if(!syncAvail)return toast('Open this link in the hosted app');
  try{
    const r=await fetch(api(id),{cache:'no-store'});
    if(r.status===404||r.status===410)return toast('Trip not found. The link may have been reset.');
    if(!r.ok)throw 0;
    const env=await r.json();let t;
    if(env.v===2){
      if(!key)return toast('This link is missing its key. Ask for the full link.');
      try{t=await decTrip(env,key)}catch(e){return toast('This link\'s key doesn\'t match the trip.')}
    }else t=env;
    const old=t.prev&&loadTrip(t.prev);
    switchTo(t);
    if(old){adopt(old);toast(`${S.name} is syncing again`)}else toast(`Joined ${S.name}`);
  }catch(e){toast('No connection. Try the link again.')}
}
function checkHash(){
  const m=location.hash.slice(1).match(/^([a-z0-9]{12,40})(?:\.([A-Za-z0-9_-]{43}))?$/);
  if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  join(m[1],m[2]);
}

/* ---- Money maths ---- */
const people=()=>S.people.filter(p=>!p.del);
const expenses=()=>S.expenses.filter(e=>!e.del).sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u);
const person=id=>S.people.find(p=>p.id===id)||{name:'?',c:0};
const pname=id=>person(id).name;
/* Initials: one letter, or two when another person shares the first letter (Sam/Sophie → Sa/So, Sam Lee/Sam Roe → SL/SR) */
function initials(id){
  const n=person(id).name.trim(),parts=n.split(/\s+/),up=x=>(x||'?')[0].toUpperCase();
  if(!people().some(q=>q.id!==id&&up(q.name.trim())===up(n)))return up(n);
  return parts.length>1?up(parts[0])+up(parts[parts.length-1]):up(n)+(n[1]||'').toLowerCase();
}
const av=(id,cls='')=>{const p=person(id),t=initials(id);return `<span class="av ${cls}${t.length>1?' two':''}" style="background:${COLORS[p.c%COLORS.length]}" title="${esc(p.name)}">${esc(t)}</span>`};
const stack=(ids,cls='sm')=>`<span class="stack">${ids.slice(0,5).map(id=>av(id,cls)).join('')}${ids.length>5?`<span class="av ${cls}" style="background:${CAT_COL.other}">+${ids.length-5}</span>`:''}</span>`;
const money=p=>{const n=Math.abs(p)/100;return (p<0?'−':'')+S.cur+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
/* Amounts: accepts 12.50, 12,50, 1.234,56, 1,234.56, 1 200, €7. The last . or , is the decimal point only if 1–2 digits follow it */
function toPence(v){
  let s=String(v).replace(/[^\d.,]/g,'');if(!/\d/.test(s))return NaN;
  const i=Math.max(s.lastIndexOf('.'),s.lastIndexOf(',')),dec=i<0?0:s.length-i-1;
  s=dec>=1&&dec<=2?s.slice(0,i).replace(/[.,]/g,'')+'.'+s.slice(i+1):s.replace(/[.,]/g,'');
  const n=parseFloat(s);return isFinite(n)?Math.round(n*100):NaN;
}
const nextColor=()=>{const used=people().map(p=>p.c);for(let i=0;i<COLORS.length;i++)if(!used.includes(i))return i;return people().length%COLORS.length};

/* Equal split in pence; leftover pennies go to the payer first, then list order */
function shares(e){
  if(!e.for||!e.for.length)return {[e.paidBy]:e.amt};
  const ids=[...e.for].sort((x,y)=>(y===e.paidBy)-(x===e.paidBy));
  const base=Math.floor(e.amt/ids.length);let r=e.amt-base*ids.length;
  const out={};ids.forEach(id=>{out[id]=base+(r-->0?1:0)});return out;
}
function balances(){
  const b={};people().forEach(p=>b[p.id]={paid:0,share:0});
  expenses().forEach(e=>{
    if(b[e.paidBy])b[e.paidBy].paid+=e.amt;
    const sh=shares(e);for(const id in sh)if(b[id])b[id].share+=sh[id];
  });
  return b;
}
/* Couples: a pair is stored on both people (p.pair) so it syncs like any other edit */
const partner=id=>{const p=person(id);if(!p.pair)return null;const q=S.people.find(x=>x.id===p.pair&&!x.del);return q&&q.pair===id?q.id:null};
const hasCouples=()=>people().some(p=>partner(p.id));
const byCouple=()=>prefs.couples!==false&&hasCouples();
/* Settling units: a couple counts as one unit when settling by couple, otherwise each person is a unit */
function units(pair=byCouple()){
  const seen=new Set(),out=[];
  people().forEach(p=>{if(seen.has(p.id))return;const q=pair?partner(p.id):null;const ids=q?[p.id,q]:[p.id];ids.forEach(i=>seen.add(i));out.push({ids})});
  return out;
}
const uName=u=>u.ids.map(pname).join(' & ');
const uAv=(u,cls='')=>u.ids.length>1?`<span class="stack">${u.ids.map(i=>av(i,cls)).join('')}</span>`:av(u.ids[0],cls);
function plan(){
  const b=balances();
  const nets=units().map(u=>({u,paid:u.ids.reduce((s,i)=>s+b[i].paid,0),n:u.ids.reduce((s,i)=>s+b[i].paid-b[i].share,0)}));
  return {nets,t:settle(nets)};
}
/* Few transfers: repeatedly match the largest debtor with the largest creditor. Always settles everyone in at most (units - 1) payments;
   finding the absolute minimum is a much harder problem and rarely differs for holiday-sized groups */
function settle(nets){
  const cr=[],db=[];
  nets.forEach(x=>{if(x.n>0)cr.push([x.u,x.n]);else if(x.n<0)db.push([x.u,-x.n])});
  const t=[];
  while(cr.length&&db.length){
    cr.sort((x,y)=>y[1]-x[1]);db.sort((x,y)=>y[1]-x[1]);
    const m=Math.min(cr[0][1],db[0][1]);t.push([db[0][0],cr[0][0],m]);
    cr[0][1]-=m;db[0][1]-=m;if(!cr[0][1])cr.shift();if(!db[0][1])db.shift();
  }
  return t;
}
function summary(){
  const {t}=plan(),total=expenses().reduce((s,e)=>s+e.amt,0);
  let s=`*${S.name}* · ${money(total)} total\n\n`;
  s+=t.length?t.map(([f,to,m])=>`${uName(f)} → ${uName(to)}: *${money(m)}*`).join('\n'):'Everyone is square ✅';
  if(syncOn())s+=`\n\n${tripLink()}`;
  return s;
}
const fmtDate=d=>{const t=today(),yd=new Date();yd.setDate(yd.getDate()-1);const y=ymd(yd);
  return d===t?'Today':d===y?'Yesterday':new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};

function myLine(e){

  const sh=shares(e)[m]||0,paid=e.paidBy===m?e.amt:0,n=paid-sh;

function meCard(){
  const m=me();

  const {t}=plan(),mine=x=>x.ids.includes(m);

  const shown=lines.slice(0,3),more=lines.length-shown.length;

      :`<li><button class="row" data-edit="${e.id}"><span class="ic" style="background:${CAT_COL[e.cat]}">${ico('c-'+e.cat)}</span><span class="main"><div class="t">${esc(e.desc)}</div><div class="who">${av(e.paidBy,'sm')}${ico('i-arrow')}${e.for.length===everyone?'<span>All</span>':stack(e.for)}${e.cc?`<span class="orig">${fmtCc(e.oamt,e.cc)}</span>`:''}${e.photo?ico('i-cam','i tiny'):''}</div></span><span class="rt"><span class="amt">${money(e.amt)}</span>${myLine(e)}</span></button></li>`).join('')+'</ul>';

let lastT=[];

    $('#raterow').hidden=!foreign();
    $('#rlab').textContent=`${f.cc}1 = ${S.cur}`;
    $('#conv').textContent=foreign()&&base>0?`= ${money(base)}`:'';
    $('#paidChips').innerHTML=P.map(p=>pa(p,p.id===f.paidBy,'paid')).join('');
    $('#forChips').innerHTML=P.map(p=>pa(p,f.for.has(p.id),'for')).join('');
    $('#paidName').textContent=pname(f.paidBy);
    $('#forName').textContent=n===P.length?'Everyone':`${n} of ${P.length}`;
    $('#each').textContent=n&&base>0?`${money(Math.round(base/n))} each`:'';
    $('#allBtn').textContent=n===P.length?'None':'All';
    const has=f.newPhoto||(f.photo&&ex);
    $('#photoArea').hidden=!has;
    $('#photoArea').innerHTML=has?`<button type="button" class="thumb" id="thumb" aria-label="View receipt"><img id="thumbImg" alt="Receipt"></button><button type="button" class="ghost" id="rmPhoto">Remove photo</button>`:'';
    if(has){const img=$('#thumbImg');if(f.newPhoto)img.src=f.newPhoto;else photoURL(ex.id,f.photo,ex.pe).then(u=>{img.src=u}).catch(()=>{img.alt='Receipt needs signal'})}
  };
  sc.innerHTML=`<form class="sheet" id="eform" role="dialog" aria-label="${isNew?'Add':'Edit'} expense">
    <div class="sh"><h3>${isNew?'New expense':'Edit expense'}</h3><div class="shr"><button type="button" class="iconbtn" id="camBtn" aria-label="Add receipt photo">${ico('i-cam')}</button><input id="fdate" type="date" value="${ex?.date||today()}" aria-label="Date"></div></div>
    <input id="fphoto" type="file" accept="image/*" hidden>
    <div class="thumbrow" id="photoArea" hidden></div>
    <div class="amtrow"><button type="button" class="ccbtn" id="ccbtn" aria-label="Currency" aria-haspopup="true"></button><input id="famt" class="field big" inputmode="decimal" value="${ex?((ex.cc?ex.oamt:ex.amt)/100).toFixed(2):''}" autocomplete="off" aria-label="Amount"><div class="ccmenu" id="ccmenu" hidden></div></div>
    <div class="raterow" id="raterow" hidden><span id="rlab"></span><input id="frate" class="field" inputmode="decimal" value="${ex?.rate||lastRate(f.cc)}" autocomplete="off" aria-label="Exchange rate"><span class="conv" id="conv"></span></div>
    <div class="descrow"><input id="fdesc" class="field" type="text" placeholder="What for?" value="${esc(ex?.desc||'')}" autocomplete="off" aria-label="Description"><button type="button" class="catbtn" id="catbtn" aria-label="Choose icon" aria-haspopup="true"></button><div class="catmenu" id="catmenu" hidden></div></div>
    <div class="lbl"><span>Paid by<em id="paidName"></em></span></div><div class="pick" id="paidChips"></div>
    <div class="lbl"><span>Split<em id="forName"></em></span><button type="button" id="allBtn"></button></div><div class="pick" id="forChips"></div>
    <div class="each" id="each"></div>
    <p class="msg" id="emsg"></p>
    <div class="foot">${isNew?'':'<button type="button" class="btn danger" id="del">Delete</button>'}<button class="btn primary">${isNew?'Add':'Save'}</button></div>
    ${ex?.by?`<p class="by">Added by ${esc(pname(ex.by))}</p>`:''}
  </form>`;
  draw();if(isNew)setTimeout(()=>$('#famt').focus(),60);
  sc.onclick=e=>{
    if(e.target===sc)return close();
    if(e.target.closest('#catbtn')){f.menu=!f.menu;f.ccMenu=false;draw();return}
    if(e.target.closest('#ccbtn')){f.ccMenu=!f.ccMenu;f.menu=false;draw();return}
    const cc=e.target.closest('[data-cc]');
    if(cc){f.cc=cc.dataset.cc;f.ccMenu=false;if(f.cc!==S.cur&&!(ex&&ex.cc===f.cc))$('#frate').value=lastRate(f.cc);draw();if(f.cc!==S.cur&&!$('#frate').value)$('#frate').focus();return}
    const ct=e.target.closest('[data-cat]');if(ct){f.cat=ct.dataset.cat;f.catSet=true;f.menu=false;draw();return}
    if((f.menu&&!e.target.closest('#catmenu'))||(f.ccMenu&&!e.target.closest('#ccmenu'))){f.menu=f.ccMenu=false;draw()}
    if(e.target.closest('#camBtn')){$('#fphoto').click();return}
    if(e.target.closest('#thumb')){const src=$('#thumbImg').src;if(src)viewPhoto(src);return}
    if(e.target.closest('#rmPhoto')){f.newPhoto=null;f.photo=0;draw();return}
    const pd=e.target.closest('[data-paid]');if(pd){f.paidBy=pd.dataset.paid;draw();return}
    const fr=e.target.closest('[data-for]');if(fr){const id=fr.dataset.for;f.for.has(id)?f.for.delete(id):f.for.add(id);draw();return}
    if(e.target.id==='allBtn'){f.for.size===P.length?f.for.clear():P.forEach(p=>f.for.add(p.id));draw();return}
    if(e.target.id==='del'){close();removeExp(ex)}
  };
  $('#fphoto').onchange=async e=>{const file=e.target.files[0];if(!file)return;
    try{f.newPhoto=await compress(file);draw()}catch(err){toast('Couldn\'t read that photo')}};
  $('#famt').oninput=draw;$('#frate').oninput=draw;
  $('#fdesc').oninput=e=>{if(!f.catSet){f.cat=matchCat(e.target.value)||null;draw()}};
  $('#eform').onsubmit=e=>{e.preventDefault();
    const a=toPence($('#famt').value),d=$('#fdesc').value.trim()||'Expense',dt=$('#fdate').value||today();
    if(!(a>0))return $('#emsg').textContent='Enter an amount.';
    if(!f.for.size)return $('#emsg').textContent='Pick who it\'s split between.';
    let amt=a,cur={cc:null,oamt:null,rate:null};
    if(foreign()){
      const r=parseFloat(String($('#frate').value).replace(',','.'));
      if(!(r>0)){$('#frate').focus();return $('#emsg').textContent=`Enter the rate: what ${f.cc}1 is in ${S.cur}.`}
      amt=Math.round(a*r);cur={cc:f.cc,oamt:a,rate:r};prefs.rates=prefs.rates||{};prefs.rates[f.cc]=r;savePrefs();
    }
    const id=isNew?uid():ex.id;
    let photo=f.photo;
    if(f.newPhoto){photo=now();queuePhoto(id,photo,f.newPhoto)}
    const rec={desc:d,amt,date:dt,paidBy:f.paidBy,for:[...f.for],cat:f.cat||'other',photo:photo||0,pe:f.newPhoto?(S.pk?1:0):(ex?.pe||0),...cur,u:now()};
    if(isNew)S.expenses.push({id,by:me()||null,...rec});else Object.assign(ex,rec);
    S.lastPayer=f.paidBy;open?.add(dt);
    save();close();tab='exp';render();toast(isNew?'Added':'Saved');
  };
}
const lastRate=cc=>{const e=S.expenses.filter(x=>!x.del&&x.cc===cc&&x.rate).sort((a,b)=>b.u-a.u)[0];return e?e.rate:((prefs.rates||{})[cc]||'')};

/* ---- Payments: recorded as an expense of type "pay" (from paid, to's share = amount) so balances just work ---- */
function openPay(ex,pre){
  const P=people(),isNew=!ex;
  const f={from:ex?.paidBy||pre?.from||me()||P[0].id};
  f.to=ex?.for[0]||pre?.to||(P.find(p=>p.id!==f.from)||P[0]).id;
  const sc=$('#scrim');sc.hidden=false;
  const draw=()=>{
    $('#fromChips').innerHTML=pickRow('pfrom',f.from);$('#toChips').innerHTML=pickRow('pto',f.to);
    $('#fromName').textContent=pname(f.from);$('#toName').textContent=pname(f.to);
  };
  sc.innerHTML=`<form class="sheet" id="pform2" role="dialog" aria-label="${isNew?'Record':'Edit'} payment">
    <div class="sh"><h3>${isNew?'Record payment':'Edit payment'}</h3><input id="pdate" type="date" value="${ex?.date||today()}" aria-label="Date"></div>
    <input id="pamt" class="field big" inputmode="decimal" placeholder="${esc(S.cur)}0.00" value="${ex?(ex.amt/100).toFixed(2):pre?(pre.amt/100).toFixed(2):''}" autocomplete="off" aria-label="Amount">
    <div class="lbl"><span>From<em id="fromName"></em></span></div><div id="fromChips"></div>
    <div class="lbl"><span>To<em id="toName"></em></span></div><div id="toChips"></div>
    <p class="msg" id="pmsg2"></p>
    <div class="foot">${isNew?'':'<button type="button" class="btn danger" id="pdel">Delete</button>'}<button class="btn primary">${isNew?'Record payment':'Save'}</button></div>
    ${ex?.by?`<p class="by">Added by ${esc(pname(ex.by))}</p>`:''}
  </form>`;
  draw();
  sc.onclick=e=>{
    if(e.target===sc)return close();
    const fr=e.target.closest('[data-pfrom]');if(fr){f.from=fr.dataset.pfrom;draw();return}
    const to=e.target.closest('[data-pto]');if(to){f.to=to.dataset.pto;draw();return}
    if(e.target.id==='pdel'){close();removeExp(ex)}
  };
  $('#pform2').onsubmit=e=>{e.preventDefault();
    const a=toPence($('#pamt').value);
    if(!(a>0))return $('#pmsg2').textContent='Enter an amount.';
    if(f.from===f.to)return $('#pmsg2').textContent='Pick two different people.';
    const rec={type:'pay',desc:'Payment',amt:a,date:$('#pdate').value||today(),paidBy:f.from,for:[f.to],cat:'other',u:now()};
    if(isNew)S.expenses.push({id:uid(),by:me()||null,...rec});else Object.assign(ex,rec);
    open?.add(rec.date);save();close();render();toast(isNew?'Payment recorded':'Saved');
  };
}

/* ---- Receipt photos: compressed on the phone, kept locally until uploaded to /api/photo/<trip>/<expense> ---- */
const PH='hs-photo-';
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.7))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
})}
function queuePhoto(id,v,data){
  try{localStorage.setItem(PH+id,JSON.stringify({t:S.id,v,data,pe:S.pk?1:0}))}catch(e){toast('Phone storage is full. Photo not saved.')}
  uploadPhotos();
}
function localPhoto(id,v){try{const x=JSON.parse(localStorage.getItem(PH+id));return x&&x.v===v?x.data:null}catch(e){return null}}
const photoUrls={};
async function photoURL(id,v,pe){
  const local=localPhoto(id,v);if(local)return local;
  const k=`${S.id}/${id}?v=${v}`;if(photoUrls[k])return photoUrls[k];
  const r=await fetch(`/api/photo/${k}`);if(!r.ok)throw new Error(r.status);
  let b=new Uint8Array(await r.arrayBuffer());
  if(pe)b=await unseal(S.pk,b);
  return photoUrls[k]=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));
}
const dataBlob=d=>{const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})};
let uploading=false;
async function uploadPhotos(){
  if(!syncAvail||!prefs.sync||uploading)return;uploading=true;
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PH))keys.push(k)}
  for(const k of keys){
    try{const x=JSON.parse(localStorage.getItem(k)),id=k.slice(PH.length),url=`/api/photo/${x.t}/${id}`;
      const tr=x.t===S.id?S:loadTrip(x.t);if(x.pe&&!(tr&&tr.pk))continue;
      const body=x.pe?new Blob([await seal(tr.pk,new Uint8Array(await dataBlob(x.data).arrayBuffer()))]):dataBlob(x.data);
      const r=await fetch(url,{method:'PUT',headers:{'content-type':x.pe?'application/octet-stream':'image/jpeg'},body});
      if(r.ok){localStorage.removeItem(k);fetch(`${url}?v=${x.v}`).catch(()=>{})}
    }catch(e){break}
  }
  uploading=false;
}
function viewPhoto(src){
  const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<img src="${src}" alt="Receipt photo. Needs signal if it hasn't loaded before."><button class="iconbtn" aria-label="Close">${ico('i-x')}</button>`;
  v.onclick=()=>v.remove();document.body.appendChild(v);
}

/* ---- Spreadsheet export ---- */
function exportCsv(){
  const q=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},n=p=>(p/100).toFixed(2),P=people();
  const head=['Date','Description','Type','Category','Paid by',`Amount (${S.cur})`,'Original currency','Original amount','Rate','Split between',...P.map(p=>`${p.name} share`)];
  const rows=expenses().slice().reverse().map(e=>{const pay=isPay(e),sh=pay?{}:shares(e);
    return [e.date,pay?`${pname(e.paidBy)} paid ${pname(e.for[0])}`:e.desc,pay?'Payment':'Expense',pay?'':CAT_NAME[e.cat],pname(e.paidBy),n(e.amt),e.cc||'',e.cc?n(e.oamt):'',e.rate||'',e.for.map(pname).join('; '),...P.map(p=>sh[p.id]?n(sh[p.id]):'')]});
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const name=(S.name.replace(/[^\w\- ]+/g,'').trim()||'trip')+'.csv';
  const file=new File([csv],name,{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:S.name}).catch(()=>{});
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Spreadsheet saved');
}

function openSettings(){
  const sc=$('#scrim');sc.hidden=false;
  const status=!syncAvail?'Sync works in the hosted app only':S.sample?'The example trip isn\'t synced':({ok:'Synced',sync:'Syncing…',offline:'Offline. Changes sync when you\'re back online.'}[$('#cloud').dataset.s]||'')+(S.key?' · encrypted':'');
  const live=prefs.trips.filter(t=>!goneAt(t)),gone=prefs.trips.filter(t=>goneAt(t)&&t.id!==S.id);
  const trips=live.map(t=>`<button class="trip" data-trip="${esc(t.id)}"><span>${esc(t.id===S.id?S.name:t.name)}</span>${t.id===S.id?ico('i-check'):''}</button>`).join('')+(S.del?`<button class="trip" data-trip="${esc(S.id)}"><span>${esc(S.name)} (deleted)</span>${ico('i-check')}</button>`:'');
  const deleted=gone.map(t=>`<div><label>${esc(t.name)}<small>${t.del?'Deleted for everyone':'Removed from this phone'} · ${daysLeft(t)} day${daysLeft(t)===1?'':'s'} left</small></label><button class="btn primary" data-restore="${esc(t.id)}">Restore</button></div>`).join('');
  sc.innerHTML=`<div class="sheet" role="dialog" aria-label="Settings">
    <div class="sh"><h3>Settings</h3><button class="iconbtn" id="sclose" aria-label="Close">${ico('i-x')}</button></div>
    ${people().length?`<div class="set"><div class="col"><label>You are<small>Shows what you owe and are owed on this phone</small></label>${pickRow('me',me())}</div></div>`:''}
    <div class="set">
      <div><label for="scur">Trip currency</label><input id="scur" class="field cur" type="text" maxlength="3" value="${esc(S.cur)}"></div>
      ${syncOn()?(S.key?`<div><label>Invite link<small>End-to-end encrypted. Resetting turns off the current link.</small></label><button class="btn danger" id="sreset">Reset link</button></div>`
        :`<div><label>Encryption<small>Encrypt this trip so only people with the link can read it. Everyone will need the new link.</small></label><button class="btn primary" id="sreset">Encrypt</button></div>`):''}
      <div><label for="ssync">Sync with group<small class="status">${status}</small></label><input id="ssync" class="sw" type="checkbox" role="switch" ${prefs.sync?'checked':''} ${syncAvail?'':'disabled'}></div>
    </div>
    <div class="set"><div class="col"><label for="simp">Import expenses<small>Paste import text into this trip</small></label>
      <textarea id="simp" class="field" rows="3" placeholder="Paste here" autocomplete="off"></textarea>
      <button class="btn primary" id="simpgo">Import</button></div></div>
    <h2 style="margin:4px 4px -6px">Trips</h2>
    <div class="set">${trips}<button class="trip newt" id="snew">${ico('i-plus')}New trip</button></div>
    ${deleted?`<h2 style="margin:4px 4px -6px">Recently deleted</h2><div class="set">${deleted}</div>`:''}
    <button class="btn danger" id="sdel">Delete this trip…</button>
  </div>`;
  sc.onclick=e=>{
    if(e.target===sc||e.target.closest('#sclose'))return close();
    const tr=e.target.closest('[data-trip]');
    if(tr){close();const id=tr.dataset.trip;if(id!==S.id){const t=loadTrip(id);t?switchTo(t):join(id)}return}
    if(e.target.closest('#snew')){close();newTrip()}
    if(e.target.closest('#sdel')){openDelete();return}
    const rr=e.target.closest('[data-restore]');if(rr){close();restoreTrip(rr.dataset.restore);return}
    const rs=e.target.closest('#sreset');if(rs){if(rs.dataset.armed){close();resetLink()}else{rs.dataset.armed=1;rs.textContent='Tap to confirm'}return}
    if(e.target.closest('#simpgo')){const t=$('#simp').value;if(importData(t))close()}
  };
  $('#scur').onchange=e=>{S.cur=e.target.value.trim()||'£';S.nu=now();save();render()};
  $('#ssync').onchange=e=>{prefs.sync=e.target.checked;savePrefs();setNet(syncOn()?'sync':'off');render();sync()};
}
/* Import: {"people":[names],"expenses":[[id,date,desc,amount,payerName,cat?,[forNames]?]]}.
   People match by name; missing people are added. No "for" list = split between everyone. Same id = skipped, so re-importing is safe. */
function importData(txt){
  let d;
  try{d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1))}catch(e){}
  if(!d||!Array.isArray(d.expenses)){toast('That isn\'t import text');return false}
  if(S.sample){S=blank();open=null}
  const find=n=>people().find(p=>p.name.trim().toLowerCase()===String(n).trim().toLowerCase());
  const ensure=n=>find(n)||(S.people.push({id:uid(),name:String(n).trim(),c:nextColor(),u:now()}),find(n));
  (d.people||[]).forEach(ensure);
  if(d.cur&&!expenses().length){S.cur=d.cur;S.nu=now()}
  let added=0;
  d.expenses.forEach(([id,date,desc,amt,payer,cat,forNames])=>{
    id=String(id);if(S.expenses.some(e=>e.id===id)||!(amt>0))return;
    const f=Array.isArray(forNames)&&forNames.length?forNames.map(n=>ensure(n).id):people().map(p=>p.id);
    S.expenses.push({id,desc:String(desc),amt:Math.round(amt*100),date:date||today(),paidBy:ensure(payer).id,for:f,cat:CATS.includes(cat)?cat:guessCat(desc),u:now()});
    added++;
  });
  save();tab='exp';open=null;render();
  toast(added?`Imported ${added} expense${added>1?'s':''}`:'Nothing new to import');
  return true;
}
function close(){const sc=$('#scrim');sc.hidden=true;sc.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)close()});
window.addEventListener('hashchange',checkHash);
/* offline: register the service worker on the hosted app only */
ready.then(()=>{if(syncAvail&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})});
render();checkHash();
</script>
